<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Glasses Try-On</title>
  </head>
  <body>
    <div id="stage">
      <!-- #view keeps the video's aspect ratio; everything inside is mirrored together. -->
      <div id="view" class="mirrored">
        <video id="video" playsinline muted></video>
        <canvas id="debug-canvas"></canvas>
      </div>
      <div id="message" hidden></div>
      <div id="fps" hidden></div>
      <div id="tuning" hidden></div>
      <div id="tune3d" hidden></div>
    </div>

    <div id="ui">
      <button id="start-btn">Start camera</button>
      <button id="glasses-btn" hidden>Glasses (G)</button>
      <button id="mode-btn" hidden>Mode: 3D (M)</button>
      <button id="debug-btn" hidden>Landmarks: off (D)</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
