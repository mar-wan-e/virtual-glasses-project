<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Glasses Try-On</title>
  </head>
  <body>
    <div id="stage">
      <!-- #view keeps the video's aspect ratio; everything inside is mirrored together. -->
      <div id="view" class="mirrored">
        <!-- The live video stays here (covered) so the browser keeps decoding
             frames; video-canvas shows each frame in sync with the glasses. -->
        <video id="video" playsinline muted></video>
        <canvas id="video-canvas"></canvas>
        <canvas id="debug-canvas"></canvas>
      </div>
      <div id="message" hidden></div>
      <div id="fps" hidden></div>
      <div id="tuning" hidden></div>
      <div id="tune3d" hidden></div>
    </div>

    <div id="ui">
      <button id="start-btn">Start camera</button>
      <!-- Thumbnail buttons, one per design; built by ui.js from glasses.js. -->
      <div id="picker" role="radiogroup" aria-label="Glasses" hidden></div>
      <button id="mode-btn" hidden>Mode: 3D (M)</button>
      <button id="debug-btn" hidden>Landmarks: off (D)</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
